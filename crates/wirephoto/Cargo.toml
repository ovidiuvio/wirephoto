[package]
name = "wirephoto"
description = "Serves the photos on a machine's own disks to apps over HTTP"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["macros"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.23.1"
bytes = "1.12.1"
cap-std = "4.0.3"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
fast_image_resize = "6.1.0"
futures = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
http-body-util = "0.1.5"
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "webp", "bmp", "tiff", "jpeg"] }
infer = "0.22.0"
jpegli-sys = { path = "../jpegli-sys", optional = true }
libheif-rs = { version = "3.0.0", optional = true, default-features = false, features = ["v1_17"] }
moka = { version = "0.12.16", features = ["future"] }
moxcms = "0.9.1"
notify = "8.2.0"
parking_lot = "0.12.5"
percent-encoding = "2.3.2"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
rand = "0.10.3"
redb = "4.4.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.5", features = ["net"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
toml = "1.1.8"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
turbojpeg = { version = "1.5.1", default-features = false, features = ["cmake", "pkg-config"] }
wirephoto-api = { path = "../wirephoto-api" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"
seccompiler = "0.5.0"

[features]
default = ["heic", "jpegli"]
heic = ["dep:libheif-rs"]
# jpegli for the cached 640 px previews (built from crates/jpegli-sys/vendor with cmake); without it,
# libjpeg-turbo with Huffman optimisation encodes them.
jpegli = ["dep:jpegli-sys"]
