# wirephoto configuration. Mount your own over /etc/wirephoto.toml.

# Where apps reach the server (informational; URLs in responses are relative).
# public_url = "https://photos.home.example.com"
listen = "0.0.0.0:8443"

# Index, preview cache and server secret. Put it on an SSD.
data = "/data"

# Browser apps on https:// can only reach an https:// server. Either give wirephoto a certificate
# (from ACME or `tailscale cert`) or put a TLS-terminating reverse proxy in front and leave this out.
# [tls]
# cert = "/data/tls/cert.pem"
# key = "/data/tls/key.pem"

[[library]]
id = "photos"            # its API ID is lib_photos
name = "Photos"
path = "/photos"
read_only = false
trash_days = 30          # deletes go to the trash, emptied after this many days; 0: never
watch = "auto"           # auto | poll (use poll for NFS/SMB mounts)
poll_seconds = 60

[cache]
max_size = "50GB"        # preview cache on disk, all sizes: 640 px ~35 GB per million photos, 2560 px ~0.3-1 MB each
memory = "256MB"         # previews kept in memory in front of it (a 640 px preview is ~35 KB)
pregenerate = true       # make the 640 px preview of every photo ahead of time

# Previews are decoded in sandboxed `wirephoto decode` worker processes.
# [decode]
# workers = 0            # previews rendered at once (half of them for pre-generation); 0: one per CPU
# ffmpeg = "/usr/bin/ffmpeg"  # video posters and durations (ffprobe next to it); default: from PATH

# Background work (reading files, previews, hashing) runs at low priority: its decode workers yield the CPU to
# requests', and while the API is in use previews go one at a time and hashing waits.
# [background]
# yield_seconds = 10     # how long the API must be idle before full speed again; 0: never slow down

# [log]
# file = true            # also log to <data>/logs/wirephoto.log.<date> (survives a recreated container)
# keep_days = 14         # log files kept
# access = true          # one line per API request: method, path, status, time, size, key, client
# audit_days = 365       # audit trail kept in the index (`wirephoto audit`)
